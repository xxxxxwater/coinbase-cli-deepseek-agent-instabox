name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 shellcheck
        # 自托管 runner 是长期存在的机器，装了就不再重装
        run: |
          if command -v shellcheck >/dev/null; then
            echo "shellcheck $(shellcheck --version | awk '/version:/ {print $2}') 已安装"
          else
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi

      - name: 静态检查（shellcheck）
        # 测试脚本也一起查 —— 测试里写错不会让 CI 红，只会让测试骗人
        run: shellcheck scripts/*.sh scripts/lib/*.sh install.sh uninstall.sh guard/coinbase tests/*.sh tests/unit/*.sh

      - name: 语法检查
        run: make syntax

      - name: 单元测试
        run: bash tests/run.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要全历史：工作区干净不代表没泄漏过，删掉的那条 commit 还在 GitHub 上
          fetch-depth: 0
      - name: 扫描工作区与全部历史
        run: bash scripts/secret-scan.sh
