name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 shellcheck
        # 自托管 runner 是长期存在的机器，装了就不再重装
        run: |
          if command -v shellcheck >/dev/null; then
            echo "shellcheck $(shellcheck --version | awk '/version:/ {print $2}') 已安装"
          else
            sudo apt-get update -qq && sudo apt-get install -y shellcheck
          fi

      - name: 静态检查（shellcheck）
        run: shellcheck scripts/*.sh install.sh

      - name: 语法检查
        run: make syntax

      - name: 单元测试
        run: bash tests/run.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 确认没有密钥入库
        run: |
          set -e
          bad=$(git grep -nE 'sk-[A-Za-z0-9]{20,}|[0-9]{9,10}:AA[A-Za-z0-9_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!*.md' ':!docs/*' || true)
          if [ -n "$bad" ]; then echo "发现疑似密钥："; echo "$bad"; exit 1; fi
          echo "干净"
