name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 shellcheck（固定版本）
        # 版本必须固定：本地用 0.10 报"干净"、CI 用 0.11 报三条错，这种不一致
        # 会让人以为"我明明查过了"。升版本要同时改这里和 README 的说明。
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -eu
          echo "固定使用 ${SHELLCHECK_VERSION}（本地也必须是这个版本）"
          mkdir -p "$RUNNER_TEMP/sc"
          curl -sSL --max-time 120 -o "$RUNNER_TEMP/sc/sc.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar xf "$RUNNER_TEMP/sc/sc.tar.xz" -C "$RUNNER_TEMP/sc"
          sudo install -m 755 "$RUNNER_TEMP/sc/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: 静态检查（shellcheck）
        # 测试脚本也一起查 —— 测试里写错不会让 CI 红，只会让测试骗人
        run: shellcheck scripts/*.sh scripts/lib/*.sh install.sh uninstall.sh guard/coinbase tests/*.sh tests/unit/*.sh

      - name: 语法检查
        run: make syntax

      - name: 单元测试
        run: bash tests/run.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要全历史：工作区干净不代表没泄漏过，删掉的那条 commit 还在 GitHub 上
          fetch-depth: 0
      - name: 扫描工作区与全部历史
        run: bash scripts/secret-scan.sh
